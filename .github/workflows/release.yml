name: Release Inkquay

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'desktop/README.md'
      - 'software/screenshots/**'
      - 'prototype/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkquay-release-main
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            platform: mac
            args: --mac zip dmg --universal
            artifact: mac-universal
          - name: Windows x64
            os: windows-latest
            platform: win
            args: --win nsis --x64
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb --x64
            artifact: linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm -C software install --frozen-lockfile

      - name: Set release version
        run: npm version "${{ env.RELEASE_VERSION }}" --no-git-tag-version

      - name: Build web bundle
        run: pnpm build

      - name: Build desktop server bundle
        run: node scripts/build-desktop.mjs

      - name: Configure optional macOS signing
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "macOS signing enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No macOS certificate; packaging unsigned"
          fi

      - name: Package
        shell: bash
        run: |
          set +e
          npx electron-builder ${{ matrix.args }} --publish never 2>&1 | tee /tmp/package.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -80 /tmp/package.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List artifacts
        run: find release -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Inkquay ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

      - name: Summarize
        run: |
          echo "### Inkquay ${{ env.RELEASE_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published macOS universal, Windows x64 and Linux x64 artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "Update channels: latest-mac.yml / latest.yml / latest-linux.yml" >> "$GITHUB_STEP_SUMMARY"
