name: Release Inkquay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkquay-release-main
  cancel-in-progress: true

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm -C software install --frozen-lockfile

      - name: Set release version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Build web bundle
        run: pnpm build

      - name: Build desktop server bundle
        run: node scripts/build-desktop.mjs

      - name: Configure optional code signing
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Code signing enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate; building unsigned"
          fi

      - name: Package macOS release (unsigned)
        shell: bash
        run: |
          set +e
          npx electron-builder --mac zip dmg --arm64 --publish never 2>&1 | tee /tmp/package.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -60 /tmp/package.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Inkquay ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            desktop/release/Inkquay-*.dmg
            desktop/release/Inkquay-*.zip
            desktop/release/latest-mac.yml
            desktop/release/*.blockmap

      - name: Summarize
        run: |
          echo "### Inkquay ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published macOS arm64 DMG + ZIP to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-update channel: latest-mac.yml" >> "$GITHUB_STEP_SUMMARY"
